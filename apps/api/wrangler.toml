name = "micronation-api"
main = "src/index.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "micronation-db"
database_id = "18f2f630-ecd7-49e2-865a-b0376aa338f0" # 2026-08-26 wrangler d1 create 產生

# 前端同源部署:同一 Worker 服務 apps/web 的 build 產物,/api/* 進 Hono,其餘走 SPA fallback。
# 部署前先 `npm run build -w @micronation/web`。
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# 暫定 development:尚無 RESEND_API_KEY,mail fail-closed 會擋掉 production 的註冊。
# 申請 Resend 後改 production 並 `wrangler secret put RESEND_API_KEY`。
ENVIRONMENT = "development"

[triggers]
crons = ["0 * * * *"]

# tick-cron handler(M8 已實作)——src/index.ts 的 default export scheduled() 呼叫
# src/tick/run.ts runTick():resolveTick 整合、NPC 決策(走與玩家 route 相同的
# apps/api/src/game/actions.ts)、單一 D1 batch 交易寫回。
#
# POST /api/admin/season 需要 ADMIN_TOKEN——正式環境用
# `wrangler secret put ADMIN_TOKEN` 設定,不寫入本檔(避免明碼進版控)。
