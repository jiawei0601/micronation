name = "micronation-api"
main = "src/index.ts"
compatibility_date = "2026-08-26"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "micronation-db"
database_id = "00000000-0000-0000-0000-000000000000" # placeholder — 建立實體 D1 後由 `wrangler d1 create` 覆蓋

[triggers]
crons = ["0 * * * *"]

